<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AjuanCuti</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #2563eb;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #2563eb;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #1a1a2e;
            background: #f9fafb;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .btn-reset {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-reset:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-reset:active {
            transform: translateY(0);
        }

        .btn-reset:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-reset .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            line-height: 1.5;
        }

        .message.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            display: block;
        }

        .message.success {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
            display: block;
        }

        .message.expired {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #6b7280;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
        }

        .toggle-password:hover {
            color: #2563eb;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 002 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/>
                </svg>
            </div>
            <span class="logo-text">AjuanCuti</span>
        </div>

        <h1 class="title">Reset Password</h1>
        <p class="subtitle">Masukkan password baru Anda di bawah ini</p>

        <div id="message" class="message"></div>

        <form id="resetForm">
            <div class="form-group">
                <label for="password_baru">Password Baru</label>
                <div class="password-wrapper">
                    <input type="password" id="password_baru" name="password_baru" placeholder="Masukkan password baru" required minlength="6">
                    <button type="button" class="toggle-password" data-target="password_baru" aria-label="Tampilkan password">
                        <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-off" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="konfirmasi">Konfirmasi Password</label>
                <div class="password-wrapper">
                    <input type="password" id="konfirmasi" name="konfirmasi" placeholder="Ulangi password baru" required minlength="6">
                    <button type="button" class="toggle-password" data-target="konfirmasi" aria-label="Tampilkan password">
                        <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-off" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-reset" id="btnReset">Reset Password</button>
        </form>

        <div class="back-link">
            Silahkan kembali ke halaman login setelah selesai ganti password.
        </div>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const form = document.getElementById('resetForm');
        const messageEl = document.getElementById('message');
        const btnReset = document.getElementById('btnReset');

        if (!token) {
            messageEl.textContent = 'Token tidak ditemukan. Silakan minta link reset password baru.';
            messageEl.className = 'message error';
            form.style.display = 'none';
        }

        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                btn.querySelector('.eye-open').style.display = isPassword ? 'none' : 'block';
                btn.querySelector('.eye-off').style.display = isPassword ? 'block' : 'none';
                btn.setAttribute('aria-label', isPassword ? 'Sembunyikan password' : 'Tampilkan password');
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password_baru = document.getElementById('password_baru').value;
            const konfirmasi = document.getElementById('konfirmasi').value;

            if (password_baru !== konfirmasi) {
                messageEl.textContent = 'Konfirmasi password tidak cocok.';
                messageEl.className = 'message error';
                return;
            }

            if (password_baru.length < 6) {
                messageEl.textContent = 'Password minimal 6 karakter.';
                messageEl.className = 'message error';
                return;
            }

            btnReset.disabled = true;
            btnReset.innerHTML = '<span class="spinner"></span>Memproses...';
            messageEl.className = 'message';

            try {
                const response = await fetch('/auth/confirm-reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, password_baru: password_baru })
                });

                const data = await response.json();

                if (response.ok) {
                    messageEl.textContent = data.detail + ' Silahkan kembali ke halaman login.';
                    messageEl.className = 'message success';
                    form.style.display = 'none';
                } else {
                    let text = data.detail || 'Terjadi kesalahan.';
                    if (text.includes('expired')) {
                        messageEl.className = 'message expired';
                        text += ' Silakan minta link reset password baru.';
                    } else {
                        messageEl.className = 'message error';
                    }
                    messageEl.textContent = text;
                    btnReset.disabled = false;
                    btnReset.innerHTML = 'Reset Password';
                }
            } catch (err) {
                messageEl.textContent = 'Gagal menghubungi server. Coba lagi nanti.';
                messageEl.className = 'message error';
                btnReset.disabled = false;
                btnReset.innerHTML = 'Reset Password';
            }
        });
    </script>
</body>
</html>
